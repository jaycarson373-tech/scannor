<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07090b" />
  <title>Scannor · front-run desk</title>
  <meta name="description" content="Live narratives, runners and open launch ideas from pump.fun, DexScreener, 4chan and Know Your Meme." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307090b'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2336f1a0' stroke-width='2.5'/%3E%3Cpath d='M16 16 L23 9' stroke='%2336f1a0' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="radar" aria-hidden="true"></span><b>SCANNOR</b><span class="tag">front-run desk</span></div>
    <div class="meta">
      <span id="stamp" class="mono">loading…</span>
      <span id="heat" class="pill"></span>
      <button id="refresh" class="btn" type="button">Rescan</button>
    </div>
  </header>
  <div id="sources" class="sources" aria-label="Source status"></div>

  <main class="grid">
    <section class="ideas" aria-labelledby="ideas-h">
      <div class="section-head">
        <h2 id="ideas-h">Ideas</h2>
        <div class="tabs" role="tablist">
          <button class="tab on" data-filter="usable" role="tab">Open lanes</button>
          <button class="tab" data-filter="beta" role="tab">Beta plays</button>
          <button class="tab" data-filter="culture" role="tab">Culture</button>
          <button class="tab" data-filter="all" role="tab">All</button>
        </div>
      </div>
      <p id="llm" class="note"></p>
      <div id="idea-list" class="idea-list"></div>
    </section>

    <aside class="side">
      <section class="panel"><h3>Runners <small>last 48h, $100K+ vol</small></h3><div id="runners"></div></section>
      <section class="panel"><h3>Narratives <small>in runners and threads</small></h3><div id="narratives"></div></section>
      <section class="panel"><h3>Hot threads <small>replies / hour</small></h3><div id="threads"></div></section>
      <section class="panel"><h3>Know Your Meme</h3><div id="kym"></div></section>
    </aside>
  </main>
  <footer class="foot mono">Descriptive signals, not advice. Lanes checked against pump.fun search (DexScreener fallback).</footer>
  <script src="/app.js" type="module"></script>
</body>
</html>
